<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="900" height="80" role="img" aria-label="Field report — live intel">
  <style>
    .t { font: bold 22px 'Courier New', monospace; fill:#00B4FF; letter-spacing:4px; }
    .s { font: bold 12px 'Courier New', monospace; fill:#4FC3F7; letter-spacing:1px; }
    .k { font: 12px 'Courier New', monospace; fill:#0A6FA8; letter-spacing:1px; }
    .live { animation: blink 1.2s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0 } }
    .tick { animation: roll 18s linear infinite; }
    @keyframes roll { from { transform: translateX(0); } to { transform: translateX(-845px); } }
    .beam { animation: sweep 3s ease-in-out infinite alternate; }
    @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(780px); } }
    .bars rect { fill:#00B4FF; transform-box: fill-box; transform-origin: bottom; animation: eq 1.1s ease-in-out infinite alternate; }
    @keyframes eq { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
  </style>
  <defs>
    <linearGradient id="b" x1="0" x2="1"><stop offset="0" stop-color="#00B4FF" stop-opacity="0"/><stop offset=".5" stop-color="#00B4FF" stop-opacity=".25"/><stop offset="1" stop-color="#00B4FF" stop-opacity="0"/></linearGradient>
    <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".35"/></pattern>
    <clipPath id="frame"><rect width="900" height="80" rx="8"/></clipPath>
    <clipPath id="tk"><rect x="20" y="52" width="860" height="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="900" height="80" fill="#010A16"/>
    <rect class="beam" width="120" height="80" fill="url(#b)"/>
    <g fill="none" stroke="#00B4FF" stroke-width="2"><path d="M8 20 V8 H20"/><path d="M880 8 H892 V20"/><path d="M8 60 V72 H20"/><path d="M880 72 H892 V60"/></g>
    <text class="t" x="24" y="36">FIELD REPORT</text>
    <circle class="live" cx="750" cy="29" r="5" fill="#FF3B3B"/>
    <text class="s" x="762" y="34">LIVE INTEL</text>
    <g class="bars">
      <rect x="852" y="20" width="4" height="16" style="animation-delay:0s"/>
      <rect x="858" y="20" width="4" height="16" style="animation-delay:.3s"/>
      <rect x="864" y="20" width="4" height="16" style="animation-delay:.6s"/>
      <rect x="870" y="20" width="4" height="16" style="animation-delay:.15s"/>
    </g>
    <line x1="20" y1="46" x2="880" y2="46" stroke="#0A6FA8"/>
    <g clip-path="url(#tk)"><g class="tick"><text class="k" x="20" y="66" textLength="845" lengthAdjust="spacing">INTEL FEED ▸ COMMITS ▸ PULL REQUESTS ▸ CONTRIBUTION STREAK ▸ LANGUAGE DEPLOYMENT ▸ OPERATOR ACTIVITY ▸ </text><text class="k" x="865" y="66" textLength="845" lengthAdjust="spacing">INTEL FEED ▸ COMMITS ▸ PULL REQUESTS ▸ CONTRIBUTION STREAK ▸ LANGUAGE DEPLOYMENT ▸ OPERATOR ACTIVITY ▸ </text></g></g>
    <rect width="900" height="80" fill="url(#lines)"/>
    <rect x="1" y="1" width="898" height="78" rx="8" fill="none" stroke="#00B4FF" stroke-opacity=".6" stroke-width="2"/>
  </g>
</svg>