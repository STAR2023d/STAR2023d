<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="900" height="110" role="img" aria-label="End of transmission — over and out">
  <style>
    .lbl { font: bold 12px 'Courier New', monospace; fill:#4FC3F7; letter-spacing:1px; }
    .big { font: bold 18px 'Courier New', monospace; fill:#CFF3FF; letter-spacing:3px; }
    .bin { font: 11px 'Courier New', monospace; fill:#0A6FA8; letter-spacing:1px; }
    .amp { transform-box: view-box; transform-origin: 0 58px; animation: decay 9s ease-in infinite; }
    @keyframes decay { 0%,15% { transform: scaleY(1); } 65% { transform: scaleY(.04); } 90% { transform: scaleY(0); } 100% { transform: scaleY(1); } }
    .roll { animation: roll 1.2s linear infinite; }
    @keyframes roll { from { transform: translateX(0); } to { transform: translateX(-200px); } }
    .bars rect { fill:#00B4FF; animation: drop 9s steps(1) infinite; }
    @keyframes drop { 0%,20% { opacity:1; } 25%,95% { opacity:.12; } 100% { opacity:1; } }
    .m1 { animation: m1 9s steps(1) infinite; }
    .m2 { opacity:0; animation: m2 9s steps(1) infinite; }
    @keyframes m1 { 0%,60% { opacity:1; } 61%,100% { opacity:0; } }
    @keyframes m2 { 0%,60% { opacity:0; } 61%,97% { opacity:1; } 98%,100% { opacity:0; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    .dot { animation: blink .8s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0 } }
  </style>
  <defs>
    <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".35"/></pattern>
